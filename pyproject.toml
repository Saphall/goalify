[project]
name = "goalify"
version = "0.1.0"
description = "A Python goal tracker with a liquid-glass interface and local SQLite storage."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.1,<4",
]

[project.scripts]
app = "goalify.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["goalify*"]

[tool.setuptools.package-data]
goalify = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[dependency-groups]
browser = [
    "playwright>=1.50,<2",
]

